<!--
  logo.svg — herdr-plus brand mark (favicon)
  Created on 2026-06-11. Copyright © 2026 Cloudmanic Labs, LLC.
  A minimal hairline "+" in slate — the "plus" is the whole idea: extensions
  layered on top of herdr. Standalone, no badge. Used only as the SVG favicon
  (the in-page lockup inlines its own currentColor copy). The embedded style
  adapts the stroke to the browser's color scheme: slate on light chrome, a
  soft light-slate on dark chrome.
-->
<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="herdr plus">
  <style>
    .mark { stroke: #334155; }
    @media (prefers-color-scheme: dark) { .mark { stroke: #cbd5e1; } }
  </style>
  <path class="mark" d="M32 8V56M8 32H56" stroke-width="6" stroke-linecap="round"/>
</svg>
